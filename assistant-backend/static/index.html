<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Scheduler Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202B; --muted:#66727F; --line:#DCE2E9;
  --oled:#2F6BFF; --oled-soft:#E4ECFF; --alarm:#B86E00; --alarm-soft:#FFF1D6; --danger:#C2372F;
  --screen:#0A1020;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#18212C; --ink:#E8EDF3; --muted:#8C99A8; --line:#2A3542;
    --oled:#6E9BFF; --oled-soft:#1C2C4E; --alarm:#F0B04A; --alarm-soft:#3A2D12; --danger:#FF7A72;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:24px 16px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oled);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:grid;gap:20px;align-content:start}
h2{font:700 1.05rem/1.2 var(--head);margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.day h1{font:700 2.4rem/1 var(--head);margin:0;letter-spacing:-.02em}
.day p{margin:6px 0 0;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--oled)}
.btn.primary{background:var(--oled);border-color:var(--oled);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.pill{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--danger)}
.pill.live::before{background:#2EA36A}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 0;text-align:center;cursor:pointer;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:.75rem}
.chip b{font-family:var(--head);font-size:1.05rem}
.chip i{display:block;height:5px;margin-top:4px}
.chip i::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--oled);opacity:0}
.chip.has i::after{opacity:1}
.chip.sel{background:var(--oled-soft);border-color:var(--oled)}

.plans{list-style:none;margin:0;padding:0}
.plan{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.plan:first-child{border-top:0}
.plan input[type=time]{border:1px solid transparent;background:var(--oled-soft);border-radius:8px;padding:6px 8px;font-weight:600;width:100%}
.plan input[type=time]:hover{border-color:var(--oled)}
.plan .title{overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--danger)}
.empty{color:var(--muted);padding:12px 0}
.add{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
@media(max-width:520px){.add{grid-template-columns:1fr 1fr}.add .btn{grid-column:1/-1}.plan{grid-template-columns:140px 1fr auto}}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;width:100%}

.robot{display:grid;gap:14px}
.face{background:var(--screen);border-radius:14px;height:96px;display:flex;justify-content:center;align-items:center;gap:22px;position:relative;overflow:hidden}
.face i{width:22px;height:34px;border-radius:5px;background:var(--oled);box-shadow:0 0 12px var(--oled);transition:height .25s,border-radius .25s;animation:blink 5s infinite}
.face[data-s="thinking"] i{animation:look 1s ease-in-out infinite alternate}
.face[data-s="speaking"] i{height:22px;border-radius:12px 12px 4px 4px;animation:none}
.face[data-s="error"] i{height:6px;animation:none;background:var(--danger);box-shadow:none}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes look{from{transform:translateX(-9px)}to{transform:translateX(9px)}}
.say{display:flex;gap:8px}
.reply{background:var(--oled-soft);border-radius:10px;padding:10px 12px;min-height:44px;color:var(--ink)}
.reply.idle{color:var(--muted);background:transparent;padding:0}
.hint{font-size:.85rem;color:var(--muted);margin:0}

.alarms{list-style:none;margin:0 0 12px;padding:0}
.alarm{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.alarm:first-child{border-top:0}
.alarm .t{font:700 1.25rem var(--head);color:var(--alarm);min-width:86px}
.alarm .m{flex:1;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.alarm.off .t{color:var(--muted);text-decoration:line-through}
.alarm-add{display:grid;grid-template-columns:150px 1fr;gap:8px}
.alarm-add .btn{grid-column:1/-1}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){.face i{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <div class="top">
      <div class="day"><h1 id="dow"></h1><p id="full"></p></div>
      <div>
        <div class="nav">
          <button class="btn" id="prev" aria-label="Previous day">&lsaquo;</button>
          <button class="btn" id="today">Today</button>
          <button class="btn" id="next" aria-label="Next day">&rsaquo;</button>
        </div>
        <div style="text-align:right;margin-top:8px"><span class="pill" id="live">Connecting</span></div>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <ul class="plans" id="plans"></ul>
    <form class="add" id="addForm">
      <input class="field" id="newTitle" placeholder="Add a plan, e.g. Dentist visit" required maxlength="120" aria-label="Plan title">
      <input class="field" id="newTime" type="time" value="09:00" required aria-label="Start time">
      <button class="btn primary" type="submit">Add plan</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </main>

  <aside class="stack">
    <section class="panel robot">
      <h2>Talk to the robot</h2>
      <div class="face" id="face" data-s="idle" aria-hidden="true"><i></i><i></i></div>
      <form class="say" id="sayForm">
        <input class="field" id="say" placeholder="Move the 1 o'clock meeting to 3" required aria-label="Command">
        <button class="btn primary" type="submit">Send</button>
      </form>
      <div class="reply idle" id="reply" aria-live="polite">Type what you would say out loud. The robot answers here and updates your plans.</div>
    </section>

    <section class="panel">
      <h2>Alarms</h2>
      <ul class="alarms" id="alarms"></ul>
      <form class="alarm-add" id="alarmForm">
        <input class="field" id="aTime" type="time" value="05:00" required aria-label="Alarm time">
        <select class="field" id="aRepeat" aria-label="Repeat">
          <option value="once">Once</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Weekdays</option>
        </select>
        <button class="btn" type="submit">Set alarm</button>
      </form>
    </section>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt12 = t => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const REPEAT = { once: "One time", daily: "Every day", weekdays: "Weekdays" };

let sel = ymd(new Date()), events = [], alarms = [];

async function api(path, opt = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opt });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.detail || r.statusText);
  }
  return r.json();
}
const showErr = e => { $("#err").textContent = e ? `Could not complete that: ${e.message || e}` : ""; };

function weekStart(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

async function load() {
  const a = weekStart(parse(sel)), b = new Date(a); b.setDate(b.getDate() + 6);
  try {
    [events, alarms] = await Promise.all([
      api(`/api/events?date_from=${ymd(a)}&date_to=${ymd(b)}`),
      api("/api/alarms"),
    ]);
    showErr(null);
  } catch (e) { showErr(e); }
  render();
}

function render() {
  const d = parse(sel);
  $("#dow").textContent = d.toLocaleDateString(undefined, { weekday: "long" });
  $("#full").textContent = d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });

  // week strip
  const strip = $("#strip"); strip.replaceChildren();
  const start = weekStart(d), today = ymd(new Date());
  for (let i = 0; i < 7; i++) {
    const day = new Date(start); day.setDate(start.getDate() + i);
    const key = ymd(day);
    const chip = document.createElement("button");
    chip.className = "chip" + (key === sel ? " sel" : "") + (events.some(e => e.date === key) ? " has" : "");
    chip.innerHTML = "<small></small><b></b><i></i>";
    chip.children[0].textContent = day.toLocaleDateString(undefined, { weekday: "short" });
    chip.children[1].textContent = day.getDate();
    if (key === today) chip.title = "Today";
    chip.onclick = () => { sel = key; load(); };
    strip.append(chip);
  }

  // plans for the selected day
  const list = $("#plans"); list.replaceChildren();
  const todays = events.filter(e => e.date === sel);
  if (!todays.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Nothing planned for this day. Add a plan below or tell the robot.";
    list.append(li);
  }
  for (const e of todays) {
    const li = document.createElement("li"); li.className = "plan";
    const time = document.createElement("input");
    time.type = "time"; time.value = e.start_time; time.setAttribute("aria-label", `Start time for ${e.title}`);
    time.onchange = () => act(() => api(`/api/events/${e.id}`, { method: "PATCH", body: JSON.stringify({ start_time: time.value }) }));
    const title = document.createElement("span"); title.className = "title"; title.textContent = e.title;
    const del = document.createElement("button");
    del.className = "x"; del.textContent = "\u00d7"; del.setAttribute("aria-label", `Delete ${e.title}`);
    del.onclick = () => act(() => api(`/api/events/${e.id}`, { method: "DELETE" }));
    li.append(time, title, del); list.append(li);
  }

  // alarms
  const al = $("#alarms"); al.replaceChildren();
  if (!alarms.length) {
    const li = document.createElement("li"); li.className = "empty"; li.textContent = "No alarms set.";
    al.append(li);
  }
  for (const a of alarms) {
    const li = document.createElement("li"); li.className = "alarm" + (a.enabled ? "" : " off");
    const t = document.createElement("span"); t.className = "t"; t.textContent = fmt12(a.time);
    const m = document.createElement("span"); m.className = "m";
    m.textContent = (a.enabled ? REPEAT[a.repeat] : "Already rang") + (a.label ? ` \u2013 ${a.label}` : "");
    const del = document.createElement("button");
    del.className = "x"; del.textContent = "\u00d7"; del.setAttribute("aria-label", `Delete alarm at ${fmt12(a.time)}`);
    del.onclick = () => act(() => api(`/api/alarms/${a.id}`, { method: "DELETE" }));
    li.append(t, m, del); al.append(li);
  }
}

async function act(fn) { try { await fn(); showErr(null); } catch (e) { showErr(e); } load(); }

// navigation
const shift = n => { const d = parse(sel); d.setDate(d.getDate() + n); sel = ymd(d); load(); };
$("#prev").onclick = () => shift(-1);
$("#next").onclick = () => shift(1);
$("#today").onclick = () => { sel = ymd(new Date()); load(); };

// forms
$("#addForm").onsubmit = ev => {
  ev.preventDefault();
  act(async () => {
    await api("/api/events", { method: "POST", body: JSON.stringify({ title: $("#newTitle").value.trim(), date: sel, start_time: $("#newTime").value }) });
    $("#newTitle").value = "";
  });
};
$("#alarmForm").onsubmit = ev => {
  ev.preventDefault();
  act(() => api("/api/alarms", { method: "POST", body: JSON.stringify({ time: $("#aTime").value, repeat: $("#aRepeat").value }) }));
};

// talk to the robot
const face = $("#face"), reply = $("#reply");
$("#sayForm").onsubmit = async ev => {
  ev.preventDefault();
  const text = $("#say").value.trim(); if (!text) return;
  face.dataset.s = "thinking"; reply.className = "reply"; reply.textContent = "Thinking\u2026";
  try {
    const r = await api("/api/command", { method: "POST", body: JSON.stringify({ text, session_id: "dashboard" }) });
    reply.textContent = r.reply; face.dataset.s = "speaking"; $("#say").value = "";
    setTimeout(() => { face.dataset.s = "idle"; }, 2500);
    if (r.changed) load();
  } catch (e) {
    reply.textContent = `The assistant could not answer. ${e.message}`; face.dataset.s = "error";
    setTimeout(() => { face.dataset.s = "idle"; }, 2500);
  }
};

// live updates from the backend
let ws;
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  const live = $("#live");
  ws.onopen = () => { live.textContent = "Live"; live.className = "pill live"; };
  ws.onmessage = () => load();
  ws.onclose = () => { live.textContent = "Reconnecting"; live.className = "pill"; setTimeout(connect, 2000); };
}
setInterval(() => ws && ws.readyState === 1 && ws.send("ping"), 25000);

load(); connect();
</script>
</body>
</html>
